name: AIDrawSomething
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GameCore:
    path: ../Packages/GameCore
  Drawing:
    path: ../Packages/Drawing
  Networking:
    path: ../Packages/Networking
  Persistence:
    path: ../Packages/Persistence
  Attest:
    path: ../Packages/Attest
  Commerce:
    path: ../Packages/Commerce
  Leaderboard:
    path: ../Packages/Leaderboard
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "13.1.0"

targets:
  AIDrawSomething:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../App
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.aidraw
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: GameCore
        product: GameCore
      - package: Drawing
        product: Drawing
      - package: Networking
        product: Networking
      - package: Persistence
        product: Persistence
      - package: Attest
        product: Attest
      - package: Commerce
        product: Commerce
      - package: Leaderboard
        product: Leaderboard
      - package: GoogleMobileAds
        product: GoogleMobileAds
