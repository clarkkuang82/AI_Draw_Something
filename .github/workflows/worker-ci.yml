name: Worker CI

on:
  push:
    branches: [main]
    paths:
      - 'Worker/**'
      - '.github/workflows/worker-ci.yml'
  pull_request:
    paths:
      - 'Worker/**'
      - '.github/workflows/worker-ci.yml'

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Worker/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
